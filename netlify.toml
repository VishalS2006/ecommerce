# Netlify configuration for ShopSphere E-Commerce Frontend

[build]
  # The frontend lives inside the client directory
  base = "client"
  # The output directory relative to base
  publish = "dist"
  # Build command
  command = "npm run build"

# Single Page Application (SPA) redirect rule
# Ensures all routes (e.g. /products, /cart, /admin) load index.html without 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
